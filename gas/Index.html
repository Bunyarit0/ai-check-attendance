<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAE SOLO | Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .check-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid #e2e8f0; }
        .check-card:active { transform: scale(0.96); }
        input:checked + .check-card.normal { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); }
        input:checked + .check-card.duty { background-color: #fffbeb; border-color: #f59e0b; color: #b45309; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15); }
        .tab-content { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        #toast { visibility: hidden; min-width: 260px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); color: #fff; text-align: center; border-radius: 99px; padding: 14px 24px; position: fixed; z-index: 1000; left: 50%; bottom: -60px; transform: translateX(-50%); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); font-size: 13px; font-weight: 500; }
        #toast.show { visibility: visible; opacity: 1; bottom: 30px; }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin 0.6s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased pb-28">

    <!-- Header -->
    <header class="glass px-5 py-4 sticky top-0 z-40 border-b border-slate-200/60 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-2xl shadow-md shadow-blue-500/20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-slate-900 leading-tight">TRAE SOLO</h1>
                <p class="text-[10px] text-slate-500 font-semibold tracking-wider uppercase">High-Speed Attendance</p>
            </div>
        </div>
        <button id="logout-btn" onclick="logout()" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 px-3.5 py-1.5 rounded-full hover:bg-rose-100 transition active:scale-95">ออกจากระบบ</button>
    </header>

    <!-- Navigation Bar -->
    <div class="max-w-md mx-auto px-4 pt-4 pb-2 sticky top-[73px] z-30">
        <div class="glass p-1.5 rounded-2xl shadow-sm border border-slate-200/60 flex text-xs font-semibold">
            <button onclick="switchTab('self')" id="tab-self" class="flex-1 py-2.5 text-center rounded-xl transition-all duration-200 bg-white text-slate-900 shadow-xs">นักเรียน</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-2.5 text-center rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900">กรรมการ</button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex-1 py-2.5 text-center rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900">📊 สถิติย้อนหลัง</button>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-2">

        <!-- TAB 1: SELF -->
        <div id="sec-self" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">1. เลือกชื่อ-นามสกุลของคุณ</label>
                    <select id="self-name" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition"></select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">2. เลือกสถานะการเช็คชื่อ</label>
                    <div class="grid grid-cols-3 gap-2.5">
                        <label class="cursor-pointer relative">
                            <input type="checkbox" id="self-type-zone" class="peer sr-only">
                            <div class="check-card normal bg-slate-50/70 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5">
                                <span class="text-xl">🏫</span><span class="text-xs font-bold text-slate-700">เข้าเขต</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" id="self-type-line" class="peer sr-only">
                            <div class="check-card normal bg-slate-50/70 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5">
                                <span class="text-xl">🧍‍♂️</span><span class="text-xs font-bold text-slate-700">เข้าแถว</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" id="self-type-duty" class="peer sr-only">
                            <div class="check-card duty bg-slate-50/70 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5">
                                <span class="text-xl">🧹</span><span class="text-xs font-bold text-slate-700">ทำเวร</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">3. ถ่ายรูปหลักฐานสถานที่ <span class="text-rose-500">*</span></label>
                    <input type="file" id="self-photo" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 bg-slate-50 border border-slate-200 rounded-2xl p-2 cursor-pointer transition">
                </div>

                <button id="btn-self-submit" onclick="submitData('self')" class="w-full bg-slate-900 text-white font-bold text-sm py-4 rounded-2xl shadow-lg shadow-slate-900/15 hover:bg-slate-800 active:scale-[0.98] transition-all">
                    ยืนยันการเช็คชื่อ
                </button>
            </div>
        </div>

        <!-- TAB 2: ADMIN -->
        <div id="sec-admin" class="tab-content hidden">

            <!-- Login -->
            <div id="admin-login" class="bg-white p-7 rounded-3xl shadow-sm border border-slate-200/60 text-center">
                <div class="w-14 h-14 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">🔒</div>
                <h2 class="font-bold text-slate-800 text-base mb-1">สำหรับคณะกรรมการ</h2>
                <p class="text-xs text-slate-500 mb-5">เข้าสู่ระบบเพื่อจัดการและเช็คชื่อ</p>
                <input type="text" id="admin-user" placeholder="Username" autocomplete="username" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 outline-none mb-3 text-sm focus:ring-2 focus:ring-blue-500">
                <input type="password" id="admin-pw" placeholder="Password" autocomplete="current-password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 outline-none mb-5 text-sm focus:ring-2 focus:ring-blue-500">
                <button id="btn-login" onclick="checkLogin()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-2xl shadow-md shadow-blue-600/20 hover:bg-blue-700 active:scale-[0.98] transition">เข้าสู่ระบบ</button>
            </div>

            <!-- Admin panel -->
            <div id="admin-panel" class="hidden space-y-4">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-5">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold text-slate-800 text-sm">เช็คชื่อโดยกรรมการ</h2>
                        <span id="admin-role-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">วันที่</label>
                        <input type="date" id="admin-date" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ชื่อ-นามสกุล</label>
                        <select id="admin-name" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                    </div>

                    <div class="grid grid-cols-3 gap-2.5">
                        <label class="cursor-pointer relative">
                            <input type="checkbox" id="admin-type-zone" class="peer sr-only">
                            <div class="check-card normal bg-slate-50/70 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5">
                                <span class="text-xl">🏫</span><span class="text-xs font-bold text-slate-700">เข้าเขต</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" id="admin-type-line" class="peer sr-only">
                            <div class="check-card normal bg-slate-50/70 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5">
                                <span class="text-xl">🧍‍♂️</span><span class="text-xs font-bold text-slate-700">เข้าแถว</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="checkbox" id="admin-type-duty" class="peer sr-only">
                            <div class="check-card duty bg-slate-50/70 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5">
                                <span class="text-xl">🧹</span><span class="text-xs font-bold text-slate-700">ทำเวร</span>
                            </div>
                        </label>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">รูปหลักฐาน (ไม่บังคับ)</label>
                        <input type="file" id="admin-photo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 bg-slate-50 border border-slate-200 rounded-2xl p-2 cursor-pointer">
                    </div>

                    <button id="btn-admin-submit" onclick="submitData('admin')" class="w-full bg-blue-600 text-white font-bold text-sm py-4 rounded-2xl shadow-lg shadow-blue-600/20 hover:bg-blue-700 active:scale-[0.98] transition-all">
                        บันทึกการเช็คชื่อ
                    </button>
                </div>

                <!-- Co-admin management (Super Admin only) -->
                <div id="admin-manage" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-4">
                    <h2 class="font-bold text-slate-800 text-sm">จัดการผู้ดูแลเสริม</h2>
                    <div class="space-y-2.5">
                        <input type="text" id="new-admin-user" placeholder="Username (a-z 0-9 _ . -)" autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <input type="password" id="new-admin-pw" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" autocomplete="new-password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="addAdminUi()" class="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-2xl active:scale-[0.98] transition">+ เพิ่มแอดมิน</button>
                    </div>
                    <ul id="admin-list" class="divide-y divide-slate-100 text-sm"></ul>
                </div>
            </div>
        </div>

        <!-- TAB 3: STATS -->
        <div id="sec-stats" class="tab-content hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-4">
                <div class="flex gap-2">
                    <input type="date" id="stats-date" class="flex-1 bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btn-stats" onclick="loadStats()" class="bg-slate-900 text-white font-bold text-xs px-5 rounded-2xl active:scale-95 transition">ดูข้อมูล</button>
                </div>
                <div id="stats-summary" class="grid grid-cols-3 gap-2 text-center text-xs font-bold hidden"></div>
                <ul id="stats-list" class="divide-y divide-slate-100 text-sm"></ul>
            </div>
        </div>
    </div>

    <div id="toast"></div>

<script>
/* ===================== State ===================== */
let adminToken = null;   // เก็บในหน่วยความจำเท่านั้น (ไม่ใช้ localStorage)
let adminRole = null;
let students = [];

/* ===================== Helpers ===================== */
function $(id) { return document.getElementById(id); }

function todayBangkok() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }); // yyyy-mm-dd
}

function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;               // textContent กัน XSS
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 3000);
}

function setBusy(btn, busy, label) {
    btn.disabled = busy;
    btn.textContent = '';
    if (busy) {
        const s = document.createElement('span');
        s.className = 'spinner';
        btn.appendChild(s);
        btn.appendChild(document.createTextNode('กำลังดำเนินการ...'));
    } else {
        btn.textContent = label;
    }
}

// เรียก google.script.run แบบมี success/failure handler
function callServer(fn, args, onOk, onFail) {
    google.script.run
        .withSuccessHandler(onOk)
        .withFailureHandler(err => {
            showToast('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
            if (onFail) onFail(err);
        })[fn](...args);
}

// ย่อรูปก่อนส่ง
function resizeImage(file, max = 900, quality = 0.7) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read image failed')); };
        img.src = url;
    });
}

// อนุญาตเฉพาะลิงก์ Google Drive (กัน javascript: URL)
function isSafeDriveUrl(u) {
    return typeof u === 'string' && /^https:\/\/(drive|docs)\.google\.com\//.test(u);
}

/* ===================== Tabs ===================== */
function switchTab(name) {
    ['self', 'admin', 'stats'].forEach(t => {
        $('sec-' + t).classList.toggle('hidden', t !== name);
        const b = $('tab-' + t);
        b.className = 'flex-1 py-2.5 text-center rounded-xl transition-all duration-200 ' +
            (t === name ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900');
    });
    if (name === 'stats') loadStats();
}

/* ===================== Roster ===================== */
function fillNames(list) {
    ['self-name', 'admin-name'].forEach(id => {
        const sel = $(id);
        sel.textContent = '';
        if (!list.length) {
            const o = document.createElement('option');
            o.value = ''; o.textContent = 'ยังไม่มีรายชื่อ (เพิ่มชีต Students)';
            sel.appendChild(o);
            return;
        }
        const ph = document.createElement('option');
        ph.value = ''; ph.textContent = '-- เลือกชื่อ --';
        sel.appendChild(ph);
        list.forEach(n => {
            const o = document.createElement('option');
            o.value = n; o.textContent = n;
            sel.appendChild(o);
        });
    });
}

/* ===================== Submit ===================== */
async function submitData(mode) {
    const isAdmin = mode === 'admin';
    const btn = $(isAdmin ? 'btn-admin-submit' : 'btn-self-submit');
    const label = isAdmin ? 'บันทึกการเช็คชื่อ' : 'ยืนยันการเช็คชื่อ';

    const name = $(mode + '-name').value;
    const zone = $(mode + '-type-zone').checked;
    const line = $(mode + '-type-line').checked;
    const duty = $(mode + '-type-duty').checked;
    const file = $(mode + '-photo').files[0];

    if (!name) return showToast('กรุณาเลือกชื่อ');
    if (!zone && !line && !duty) return showToast('กรุณาเลือกสถานะอย่างน้อย 1 อย่าง');
    if (!isAdmin && !file) return showToast('กรุณาถ่ายรูปหลักฐาน');
    if (isAdmin && !adminToken) return showToast('กรุณาเข้าสู่ระบบใหม่');

    setBusy(btn, true);
    let photoBase64 = '';
    try {
        if (file) photoBase64 = await resizeImage(file);
    } catch (e) {
        setBusy(btn, false, label);
        return showToast('อ่านรูปภาพไม่สำเร็จ');
    }

    const payload = { name, zone, line, duty, photoBase64, token: isAdmin ? adminToken : null };
    if (isAdmin) payload.date = $('admin-date').value;

    callServer('saveAttendance', [payload], res => {
        setBusy(btn, false, label);
        showToast(res.message || (res.success ? 'สำเร็จ' : 'ไม่สำเร็จ'));
        if (res.success) {
            ['zone', 'line', 'duty'].forEach(k => $(mode + '-type-' + k).checked = false);
            $(mode + '-photo').value = '';
            $(mode + '-name').value = '';
        }
    }, () => setBusy(btn, false, label));
}

/* ===================== Admin auth ===================== */
function checkLogin() {
    const user = $('admin-user').value.trim();
    const pw = $('admin-pw').value;
    if (!user || !pw) return showToast('กรุณากรอกข้อมูลให้ครบ');

    const btn = $('btn-login');
    setBusy(btn, true);
    callServer('verifyAdmin', [user, pw], res => {
        setBusy(btn, false, 'เข้าสู่ระบบ');
        $('admin-pw').value = '';
        if (!res.success) return showToast(res.message || 'เข้าสู่ระบบไม่สำเร็จ');
        adminToken = res.token;
        adminRole = res.role;
        showAdminPanel();
    }, () => setBusy(btn, false, 'เข้าสู่ระบบ'));
}

function showAdminPanel() {
    $('admin-login').classList.add('hidden');
    $('admin-panel').classList.remove('hidden');
    $('logout-btn').classList.remove('hidden');
    $('admin-role-badge').textContent = adminRole;
    $('admin-date').value = todayBangkok();
    $('admin-manage').classList.toggle('hidden', adminRole !== 'Super Admin');
    if (adminRole === 'Super Admin') loadAdmins();
    showToast('เข้าสู่ระบบสำเร็จ');
}

function logout() {
    if (adminToken) google.script.run.logoutAdmin(adminToken);
    adminToken = null;
    adminRole = null;
    $('admin-panel').classList.add('hidden');
    $('admin-login').classList.remove('hidden');
    $('logout-btn').classList.add('hidden');
    $('admin-list').textContent = '';
    showToast('ออกจากระบบแล้ว');
}

/* ===================== Co-admin management ===================== */
function loadAdmins() {
    callServer('getAdmins', [adminToken], list => {
        const ul = $('admin-list');
        ul.textContent = '';
        if (!list.length) {
            const li = document.createElement('li');
            li.className = 'py-3 text-xs text-slate-400 text-center';
            li.textContent = 'ยังไม่มีแอดมินเสริม';
            ul.appendChild(li);
            return;
        }
        list.forEach(u => {
            const li = document.createElement('li');
            li.className = 'py-2.5 flex items-center justify-between';
            const span = document.createElement('span');
            span.className = 'font-medium text-slate-700';
            span.textContent = u;
            const btn = document.createElement('button');
            btn.className = 'text-xs font-semibold text-rose-600 bg-rose-50 px-3 py-1 rounded-full active:scale-95';
            btn.textContent = 'ลบ';
            btn.onclick = () => removeAdminUi(u);
            li.appendChild(span);
            li.appendChild(btn);
            ul.appendChild(li);
        });
    });
}

function addAdminUi() {
    const u = $('new-admin-user').value.trim();
    const p = $('new-admin-pw').value;
    if (!u || !p) return showToast('กรุณากรอกข้อมูลให้ครบ');
    callServer('addAdmin', [adminToken, u, p], res => {
        showToast(res.message || (res.success ? 'สำเร็จ' : 'ไม่สำเร็จ'));
        if (res.success) {
            $('new-admin-user').value = '';
            $('new-admin-pw').value = '';
            loadAdmins();
        }
    });
}

function removeAdminUi(u) {
    if (!confirm('ลบแอดมิน "' + u + '" ?')) return;
    callServer('removeAdmin', [adminToken, u], res => {
        showToast(res.success ? 'ลบแล้ว' : 'ลบไม่สำเร็จ');
        loadAdmins();
    });
}

/* ===================== Stats ===================== */
function badge(text, on, cls) {
    const s = document.createElement('span');
    s.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full ' +
        (on ? cls : 'bg-slate-100 text-slate-400');
    s.textContent = text;
    return s;
}

function loadStats() {
    const date = $('stats-date').value || todayBangkok();
    $('stats-date').value = date;
    const btn = $('btn-stats');
    setBusy(btn, true);

    callServer('getDailyStats', [date, adminToken], data => {
        setBusy(btn, false, 'ดูข้อมูล');
        if (!data || typeof data !== 'object') {
            return showToast('โหลดสถิติไม่สำเร็จ ลองใหม่อีกครั้ง');
        }
        const ul = $('stats-list');
        ul.textContent = '';

        // รวมรายชื่อทั้งหมด + คนที่เช็คแล้วแต่ไม่อยู่ใน roster
        const names = students.slice();
        Object.keys(data).forEach(n => { if (names.indexOf(n) === -1) names.push(n); });

        let present = 0;
        names.forEach(n => {
            const r = data[n];
            if (r) present++;
            const li = document.createElement('li');
            li.className = 'py-3 flex items-center justify-between gap-2';

            const left = document.createElement('div');
            const nm = document.createElement('div');
            nm.className = 'font-semibold text-slate-800 text-sm';
            nm.textContent = n;
            const sub = document.createElement('div');
            sub.className = 'text-[11px] text-slate-400';
            sub.textContent = r ? ('เวลา ' + r.time + (r.role ? ' • ' + r.role : '')) : 'ยังไม่เช็คชื่อ';
            left.appendChild(nm);
            left.appendChild(sub);

            const right = document.createElement('div');
            right.className = 'flex items-center gap-1 flex-shrink-0';
            if (r) {
                right.appendChild(badge('เขต', r.zone, 'bg-blue-50 text-blue-700'));
                right.appendChild(badge('แถว', r.line, 'bg-blue-50 text-blue-700'));
                right.appendChild(badge('เวร', r.duty, 'bg-amber-50 text-amber-700'));
                if (isSafeDriveUrl(r.photo)) {
                    const a = document.createElement('a');
                    a.href = r.photo;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = '📷';
                    a.className = 'ml-1';
                    right.appendChild(a);
                }
            } else {
                right.appendChild(badge('ขาด', true, 'bg-rose-50 text-rose-600'));
            }
            li.appendChild(left);
            li.appendChild(right);
            ul.appendChild(li);
        });

        const sum = $('stats-summary');
        sum.textContent = '';
        [['มา', present, 'bg-emerald-50 text-emerald-700'],
         ['ยังไม่มา', names.length - present, 'bg-rose-50 text-rose-600'],
         ['ทั้งหมด', names.length, 'bg-slate-100 text-slate-700']].forEach(x => {
            const d = document.createElement('div');
            d.className = 'rounded-2xl py-2.5 ' + x[2];
            d.textContent = x[0] + ' ' + x[1];
            sum.appendChild(d);
        });
        sum.classList.remove('hidden');
    }, () => setBusy(btn, false, 'ดูข้อมูล'));
}

/* ===================== Init ===================== */
window.addEventListener('DOMContentLoaded', () => {
    $('stats-date').value = todayBangkok();
    $('admin-pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkLogin(); });
    fillNames([]);
    callServer('getStudents', [], list => {
        students = list || [];
        fillNames(students);
    }, () => {
        ['self-name', 'admin-name'].forEach(id => {
            $(id).textContent = '';
            const o = document.createElement('option');
            o.value = '';
            o.textContent = 'โหลดรายชื่อไม่สำเร็จ (ลอง Deploy เวอร์ชันใหม่ แล้วรีเฟรช)';
            $(id).appendChild(o);
        });
    });
});
</script>
